<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - MyRealEstate</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <!-- Hero Section -->
  <div class="home-container" id="homeContainer">
    <div class="home-text">
      <h1>Welcome to MyRealEstate</h1>
      <p>We will help you to Find your dream home!</p>
      <a href="form/register.html" class="btn-start">Get Started</a>
    </div>
    <div class="home-image">
      <img src="https://usvintagewood.com/wp-content/uploads/2021/05/image1-1024x683.jpg" alt="House Image">
    </div>
  </div>

  <!-- Properties Section -->
  <div id="properties-section">
    <h2>Available Properties</h2>
    <form class="filter-bar" id="filterForm">
      <select id="typeFilter" aria-label="Type">
        <option value="">Sale and Rent</option>
        <option value="sale">Sale</option>
        <option value="rent">Rent</option>
      </select>

      <select id="modeFilter" aria-label="Price filter type">
        <option value="below">Up to</option>
        <option value="above">Above</option>
      </select>

      <input type="number" id="priceFilter" min="0" placeholder="Price ($)" aria-label="Price">
      <button type="button" id="clearFilter">Clear</button>
    </form>
    <p class="filter-count" id="filterCount"></p>

    <div id="propertiesList"></div>
  </div>

  <script src="filter.js"></script>
  <script src="home.js"></script>
  <script src="navbar.js" data-navbar="public"></script>
</body>
</html>
