<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - MyRealEstate</title>
  <link rel="stylesheet" href="../home.css">
  <link rel="stylesheet" href="register.css">
</head>
<body class="register-page">

  <!-- Navbar -->
  <header class="navbar">
    <a href="../home.html" class="logo">MyRealEstate</a>
    <nav>
      <a href="../home.html">Home</a>
      <a href="../home.html#properties-section">Properties</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <div class="register-container" id="registerContainer">
    <h2>Create Your Account</h2>

    <form id="registerForm" novalidate>
      <input id="fullName" name="fullName" placeholder="Full Name" aria-label="Full Name" autocomplete="name" required>
      <small class="field-error" id="fullNameError"></small>

      <input id="email" name="email" type="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
      <small class="field-error" id="emailError"></small>

      <input id="password" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
      <small class="field-error" id="passwordError"></small>

      <select id="role" name="role" aria-label="Role" required>
        <option value="Buyer">Buyer</option>
        <option value="Seller">Seller</option>
      </select>

      <button type="submit" id="registerBtn">Sign Up</button>
    </form>

    <p class="form-error" id="formError" role="alert"></p>

    <div class="login-link">
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
